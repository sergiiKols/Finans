<style>
/* Токены — из DESIGN.md проекта. Менять оба места вместе. */
:root{
  --page-bg:#faf9f7; --page-fg:#2b3038;
  --card-bg:#ffffff; --card-fg:#2b3038;
  --inset-bg:#f2f0ed; --inset-fg:#4e5560;
  --head-bg:#333944; --head-fg:#f7f6f4;
  --accent-bg:#1f63c9; --accent-fg:#ffffff;
  --good:#0c7350; --warn:#7a5c00; --crit:#c33c2c;
  --border:#e3e0dc; --ring:#1f63c9;
  --c1:#2a6fd6; --c2:#d9682c; --c3:#12967a; --c4:#c98f16;
  --r-card:12px; --r-ctl:8px; --r-tag:4px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --page-bg:#1b1e23; --page-fg:#eceae7;
    --card-bg:#23272e; --card-fg:#eceae7;
    --inset-bg:#2a2f36; --inset-fg:#a8aeb8;
    --head-bg:#0f1216; --head-fg:#f2f0ed;
    --accent-bg:#5c9bf0; --accent-fg:#10141a;
    --good:#39b483; --warn:#d3a13a; --crit:#e8705f;
    --border:#343a42; --ring:#5c9bf0;
    --c1:#5c9bf0; --c2:#e58b52; --c3:#3fb79a; --c4:#d9ab3f;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page-bg); color:var(--page-fg);
  font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--s4)}
@media (min-width:768px){.wrap{padding:0 var(--s6)}}

/* --- шапка --- */
.top{position:sticky;top:0;z-index:5;background:var(--head-bg);color:var(--head-fg);
     border-bottom:1px solid var(--border)}
.top .wrap{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;
           padding-top:var(--s3);padding-bottom:var(--s3)}
h1{font-size:20px;line-height:1.25;font-weight:600;margin:0}
.top .period{font-size:12px;font-weight:500;color:var(--head-fg);opacity:.75}
.spacer{flex:1 1 auto}
.who{font-size:12px;opacity:.75}

/* --- кнопки --- */
.btn{min-height:44px;padding:0 var(--s4);border-radius:var(--r-ctl);
     font:600 14px/1 system-ui,sans-serif;cursor:pointer;border:1px solid transparent}
.btn-main{background:var(--accent-bg);color:var(--accent-fg)}
.btn-main:hover{filter:brightness(1.08)}
.btn-main:active{filter:brightness(.92)}
.btn-ghost{background:transparent;color:var(--head-fg);border-color:var(--border)}
:where(a,button,summary,[tabindex]):focus-visible,.scroller:focus{
  outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r-tag)}

/* --- секции и карточки --- */
main{padding-bottom:var(--s8)}
section{margin-top:var(--s6)}
h2{font-size:15px;line-height:1.3;font-weight:600;margin:0 0 var(--s3)}
h2 .hint{font-weight:400;font-size:12px;color:var(--inset-fg);margin-left:var(--s2)}
.card{background:var(--card-bg);color:var(--card-fg);border:1px solid var(--border);
      border-radius:var(--r-card);padding:var(--s4);min-width:0}
.grid{display:grid;gap:var(--s3)}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.people{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.halves{grid-template-columns:1fr}
@media (min-width:1024px){.halves{grid-template-columns:3fr 2fr;align-items:start}}

/* --- плитка KPI --- */
.kpi .lbl{font-size:12px;font-weight:500;color:var(--inset-fg);display:block}
.kpi .val{font-size:30px;line-height:1.1;font-weight:650;display:block;margin:var(--s2) 0 var(--s1)}
.kpi .base{font-size:12px;line-height:1.4;color:var(--inset-fg);display:block}
.unit{font-size:16px;font-weight:500;color:var(--inset-fg)}

/* --- участники --- */
.person .name{font-weight:600;display:flex;align-items:baseline;gap:var(--s2)}
.person .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.person .role{font-size:12px;color:var(--inset-fg);font-weight:400}
.person dl{display:grid;grid-template-columns:1fr auto;gap:var(--s1) var(--s2);margin:var(--s3) 0 0}
.person dt{font-size:12px;color:var(--inset-fg)}
.person dd{margin:0;text-align:right;font-weight:500}
.person dd.big{font-size:16px;font-weight:650}

/* --- таблицы --- */
.scroller{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
caption{text-align:left;font-size:12px;color:var(--inset-fg);padding-bottom:var(--s2)}
th,td{padding:var(--s2) var(--s2);border-bottom:1px solid var(--border);text-align:left;
      vertical-align:top}
thead th{background:var(--inset-bg);color:var(--inset-fg);font-size:12px;font-weight:500;
         position:sticky;top:0}
td.num,th.num{text-align:right;white-space:nowrap}
tfoot td{border-top:2px solid var(--border);border-bottom:none;font-weight:600}
tbody tr:last-child td{border-bottom:none}

/* --- мелочи --- */
.badge{display:inline-block;font-size:12px;padding:1px 6px;border-radius:var(--r-tag);
       background:var(--inset-bg);color:var(--inset-fg)}
.good{color:var(--good)} .warn{color:var(--warn)} .crit{color:var(--crit)}
.muted{color:var(--inset-fg)}
details{margin-top:var(--s3)}
summary{cursor:pointer;font-size:14px;font-weight:500;min-height:44px;display:flex;
        align-items:center;gap:var(--s2)}
details[open] .chev{transform:rotate(90deg)}
.chev{display:inline-block;transition:transform 160ms var(--ease-out)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s2);font-size:12px;
        color:var(--inset-fg)}
.legend span{display:flex;align-items:center;gap:var(--s1)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.note{font-size:14px;color:var(--inset-fg);line-height:1.5;max-width:68ch}
footer{margin-top:var(--s8);padding-top:var(--s4);border-top:1px solid var(--border)}
</style>
